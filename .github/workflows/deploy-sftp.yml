name: Deploy to SFTP Server

on:
  push:
    branches:
      - main
      - master
      - 'release/**'
      - 'hotfix/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: site/package-lock.json
      
      - name: Install dependencies
        working-directory: ./site
        run: npm ci
      
      - name: Build project
        working-directory: ./site
        run: npm run build:hostgator
      
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          # Salvar a chave SSH preservando quebras de linha
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          # Verificar se a chave é válida
          ssh-keygen -l -f ~/.ssh/id_rsa || echo "⚠️ Chave SSH pode estar inválida"
          # Adicionar host conhecido
          ssh-keyscan -H ftp.manriorj.com.br >> ~/.ssh/known_hosts 2>/dev/null || true
      
      - name: Deploy via SFTP
        run: |
          cd site/dist
          REMOTE_PATH="${FTP_REMOTE_PATH:-/}"
          # Usar IdentitiesOnly para evitar tentar múltiplas chaves
          rsync -avz --delete \
            -e "ssh -p 22 -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no -o IdentitiesOnly=yes -o PasswordAuthentication=no" \
            ./ ${{ secrets.FTP_USERNAME }}@ftp.manriorj.com.br:$REMOTE_PATH
        env:
          FTP_REMOTE_PATH: ${{ secrets.FTP_REMOTE_PATH }}

