name: Deploy to FTP Server

on:
  push:
    branches:
      - main
      - master
      - 'release/**'
      - 'hotfix/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: site/package-lock.json
      
      - name: Install dependencies
        working-directory: ./site
        run: npm ci
      
      - name: Build project
        working-directory: ./site
        run: npm run build:hostgator
      
      - name: Validate secrets
        run: |
          if [ -z "${{ secrets.FTP_USERNAME }}" ]; then
            echo "❌ ERRO: FTP_USERNAME não está configurado!"
            exit 1
          fi
          if [ -z "${{ secrets.FTP_PASSWORD }}" ]; then
            echo "❌ ERRO: FTP_PASSWORD não está configurado!"
            exit 1
          fi
          echo "✅ Secrets configurados corretamente"
        shell: bash
      
      - name: Deploy to FTP Server
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ftp.manriorj.com.br
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          protocol: ftps
          local-dir: ./site/dist/
          server-dir: ${{ secrets.FTP_REMOTE_PATH || '/' }}
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/.DS_Store
          dangerous-clean-slate: false
          dry-run: false

